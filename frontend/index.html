<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ludo Inspire</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><h1>🎲 Ludo Inspire</h1><span id="status">Offline</span></header><section id="auth" class="card"><h2>Login</h2><input id="email" placeholder="Email" type="email"><input id="password" placeholder="Password" type="password"><button onclick="login()">Login</button><p id="authMsg"></p><hr><h3>New player</h3><input id="regUser" placeholder="Username"><input id="regEmail" placeholder="Email" type="email"><input id="regPass" placeholder="Password" type="password"><button onclick="register()">Create account</button></section><section id="home" hidden><div class="grid"><div class="card"><h2>👤 Profile</h2><div id="profile"></div></div><div class="card"><h2>🏆 Leaderboard</h2><div id="leaderboard"></div></div></div><div class="card"><h2>🎮 Rooms</h2><button onclick="createRoom()">Create Room</button><button onclick="loadRooms()">Refresh</button><div id="rooms"></div></div><div class="card"><h2>🎲 Ludo Board</h2><div id="game">Join a room to start playing.</div></div><button class="logout" onclick="logout()">Logout</button></section></div><script src="app.js"></script></body></html>
